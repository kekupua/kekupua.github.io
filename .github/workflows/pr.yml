name: PR Checks

on:
  pull_request:
    branches:
      - '*'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: |
            - recursive: true
              args: [--frozen-lockfile, --strict-peer-dependencies]

      - name: Typecheck
        run: pnpm typecheck

      - name: Test restaurant discovery logic
        run: pnpm --filter portfolio test:eat:unit

      - name: Lint learning app
        run: pnpm --filter portfolio lint:learn

      - name: Build portfolio and learning app
        run: pnpm --filter portfolio build

      - name: Install test browser
        run: pnpm --filter portfolio exec playwright install --with-deps chromium

      - name: Test learning activities and offline behavior
        run: pnpm --filter portfolio test:learn

      - name: Test restaurant discovery on desktop and iPhone
        run: pnpm --filter portfolio test:eat

      - name: Upload restaurant screenshots and browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eat-browser-tests-and-screenshots
          path: |
            packages/portfolio/playwright-eat-report
            packages/portfolio/test-results-eat

      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learn-browser-tests
          path: |
            packages/portfolio/playwright-report
            packages/portfolio/test-results
